<!DOCTYPE html>
<html lang="es">
    <head>
        <title>Dashboard</title>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="styleglobal.css">
        <link rel="stylesheet" href="styledashboard.css">
    </head>
    <body>

            <header class="navbar">
                <div class="nav-left">
                    <input type="checkbox" id="menu-toggle" class="menu-toggle">
                    <label for="menu-toggle" class="menu-btn">☰</label>
                    <div class="sidebar">
                        <a href="dashboard.html">Dashboard</a>
                        <a href="citas.html">Citas</a>
                        <a href="pacientes.html">Pacientes</a>
                        <a href="ejercicios.html">Ejercicios</a>
                        <a href="Index.html">Salir</a>
                    </div>
                    <h2 class="title">DashBoard</h2>

                </div>
            </header>

            <div class="contenedor">
                <div class="b-azul">
                    <span class="b-titulo">Citas hoy</span>
                    <br>
                    <span class="b-valor">8</span>
                    <img src="calendario.png" width="50" class="img">
                </div>

                <div class="b-verde">
                    <span class="b-titulo">Pacientes</span>
                    <br>
                    <span class="b-valor"  id="num-total">0</span>
                    <img src="usuario.png" width="50" class="img">
                </div>

                <div class="b-amarillo">
                    <span class="b-titulo">Ejercicios</span>
                    <br>
                    <span class="b-valor">45</span>
                    <img src="pesa.png" width="50" class="img">
                </div>

                <div class="b-morado">
                    <span class="b-titulo">Terapeutas</span>
                    <br>
                    <span class="b-valor">6</span>
                    <img src="medical.png" width="50" class="img">
                </div>
            </div>

        <script>
           function actualizarEstadisticas() {
                // Agregamos ?t= + Date.now() para que la URL sea siempre distinta
                fetch('consultas_box.php?t=' + Date.now()) 
                    .then(response => response.json())
                    .then(data => {
                        document.getElementById('num-total').innerText = data.total;
                        document.getElementById('num-nuevos').innerText = data.nuevos;
                    })
                    .catch(error => console.error('Error al obtener datos:', error));
            }

            // Ejecutar cuando cargue la página
            actualizarEstadisticas();
            
            // Opcional: Actualizar cada 30 segundos para que sea "tiempo real"
            setInterval(actualizarEstadisticas, 30000);
        </script>>
    </body>
</html>
